<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT Flashcards</title>

<style>
:root{
  --bg:#fff;
  --fg:#111;
  --muted:#666;
  --line:#e6e6e6;
  --btn:#f6f6f6;
  --btn2:#111;
  --btnfg:#111;
  --btn2fg:#fff;
  --cardbg:rgba(255,255,255,.65);
}

body{
  margin:0;
  font:16px/1.4 -apple-system,Helvetica,Arial;
  color:var(--fg);
  background:var(--bg);
}

/* background image */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:var(--bgimg);
  background-size:115%;
  background-position:85% center;
  background-repeat:no-repeat;
  opacity:.2;
  z-index:-2;
}

/* fade */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.78) 0%,
    rgba(255,255,255,.58) 30%,
    rgba(255,255,255,.18) 48%,
    rgba(255,255,255,0) 65%
  );
  z-index:-1;
}

/* layout */
.wrap{
  max-width:680px;
  padding:40px;
}

/* controls */
.pill,.btn,select{
  border:1px solid var(--line);
  background:var(--btn);
  border-radius:12px;
  height:40px;
  padding:0 14px;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  cursor:pointer;
}

.pill.active{
  background:#111;
  color:#fff;
}

/* small controls */
header select,
header .btn:not(.pill){
  height:32px;
  font-size:12px;
  padding:0 10px;
}

/* card */
.card{
  margin-top:20px;
  padding:30px;
  border-radius:24px;
  background:var(--cardbg);
  backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.word{
  font-size:42px;
  font-weight:700;
}

.kana{
  color:var(--muted);
  font-size:22px;
}

.meaning{
  margin-top:16px;
  font-size:22px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:20px;
}

/* choices */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.choice-btn{
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--btn);
  cursor:pointer;
}

.choice-btn.correct{border-color:#22c55e;}
.choice-btn.wrong{border-color:#ef4444;}
</style>
</head>

<body>

<div class="wrap">

<header>
<div>
<button class="pill active" data-mode="learn">Learn</button>
<button class="pill" data-mode="review">Review</button>
<button class="pill" data-mode="drill">Drill</button>
</div>

<div>
<select id="level">
<option>ALL</option>
<option>N3</option>
<option>N2</option>
</select>

<select id="study">
<option value="vocab">Vocab</option>
<option value="context">Context</option>
</select>

<select id="prompt">
<option value="JPEN">JP→EN</option>
<option value="ENJP">EN→JP</option>
</select>

<button class="btn" id="auto">Auto Off</button>
<button class="btn" id="bg">BG</button>
</div>
</header>

<div class="card">
<div class="word" id="word"></div>
<div class="kana" id="kana"></div>

<div class="meaning" id="meaning"></div>

<div class="choices" id="choices"></div>

<div class="controls">
<button id="not">Not</button>
<button id="next">Next</button>
<button id="yes">Learned</button>
</div>
</div>

</div>

<script>
const BG=[
"./girl-1.jpg",
"./girl-2.jpg",
"./girl-3.jpg"
];

function randomBG(){
  const pick=BG[Math.floor(Math.random()*BG.length)];
  document.documentElement.style.setProperty("--bgimg",`url('${pick}')`);
}

function nextCard(){
  randomBG();
}

document.getElementById("next").onclick=nextCard;

randomBG();
</script>

</body>
</html>
